name: Sync library

# 手动触发（网页按钮或 GitHub 界面）或每天定时跑一次。
# 整条流水线都在 GitHub 的 runner 上完成：ffmpeg 与语音模型都由 runner 提供，
# 所以本机可以关机。
on:
  workflow_dispatch:
    inputs:
      days:
        description: '时间窗口（天）'
        default: '30'
      pages:
        description: '扫描推荐流的页数，每页 100 篇'
        default: '8'
      limit:
        description: '本次最多抓多少篇'
        default: '20'
      translate:
        description: '是否生成中文译文'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
  schedule:
    # 每天 UTC 03:00（迪拜时间 07:00）跑一次增量
    - cron: '0 3 * * *'

permissions:
  contents: write

# 同一时间只跑一个，避免两次提交打架
concurrency:
  group: sync-library
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # runner 每次都是全新虚拟机，装过的库不会自动保留。
          # 这一行让 pip 的下载缓存跨次复用，省掉重复下载 wheel 的时间。
          cache: 'pip'

      - name: 安装 ffmpeg 与 faster-whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper

      - name: 缓存语音模型
        uses: actions/cache@v4
        with:
          path: _work/hf
          key: whisper-tiny-v1

      - name: 扫描增量
        id: discover
        run: |
          mkdir -p _work
          python3 scripts/discover.py \
            --days "${{ inputs.days || 30 }}" \
            --pages "${{ inputs.pages || 8 }}" \
            --limit "${{ inputs.limit || 20 }}" \
            --out _work/new.json --ids-only > _work/ids.txt
          echo "count=$(wc -w < _work/ids.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "---- 本次候选 ----"
          cat _work/ids.txt

      - name: 抓取并本地对齐
        if: steps.discover.outputs.count != '0'
        run: |
          HF_HOME="$PWD/_work/hf" python3 scripts/add_episode.py \
            $(cat _work/ids.txt) --model tiny --no-index

      - name: 生成中文译文
        if: steps.discover.outputs.count != '0' && (inputs.translate != 'no')
        env:
          OPENAI_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.TRANSLATE_BASE_URL || 'https://api.openai.com/v1' }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'gpt-4o-mini' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::未配置 TRANSLATE_API_KEY，跳过翻译，只抓英文"
            exit 0
          fi
          for seg in data/*/segments.json; do
            dir=$(dirname "$seg")
            python3 scripts/translate.py --dir "$dir" || echo "::warning::$dir 翻译失败"
          done

      - name: 合成播放器数据
        if: steps.discover.outputs.count != '0'
        run: |
          for meta in data/*/meta.json; do
            dir=$(dirname "$meta")
            zh_args=""
            [ -f "$dir/transcript.zh.json" ] && zh_args="--zh $dir/transcript.zh.json"
            python3 scripts/build_episode.py \
              --meta "$dir/meta.json" --segments "$dir/segments.json" \
              $zh_args --out "$dir/episode.json"
          done
          python3 scripts/add_episode.py --reindex-only

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新增内容，跳过提交"
            exit 0
          fi
          git commit -m "Sync: 新增播客 $(date -u +%Y-%m-%d)"

          # 工作流运行期间可能有人推了新提交（比如改了前端）。
          # 直接 push 会被拒（non-fast-forward），而且运行器是临时的，
          # 一被拒这次抓到的内容就全丢了。所以先 rebase 到远端再推，并重试几次。
          for attempt in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $attempt 次推送被拒，先 rebase 到远端再试"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::rebase 失败，需要人工处理"
              exit 1
            fi
            sleep 5
          done
          echo "::error::连续三次推送失败，请检查分支保护设置"
          exit 1

      - name: 汇总
        if: always()
        run: |
          echo "### 同步结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          import json, os
          p = "_work/new.json"
          if os.path.exists(p):
              d = json.load(open(p, encoding="utf-8"))
              print(f"- 扫描 {d['scanned_at']}，窗口 {d['days']} 天")
              print(f"- feed {d['feed_papers']} 篇 → AI {d['ai_papers']}"
                    f"（门槛前 {d['ai_before_threshold']}）→ 新增 {len(d['new'])}")
              print(f"- 命中档位 {d.get('tier_counts')}")
          print(f"- 库内共 {len([n for n in os.listdir('data') if os.path.exists(f'data/{n}/episode.json')])} 集")
          PY
