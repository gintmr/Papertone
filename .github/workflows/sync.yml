name: Sync library

# 手动触发（网页按钮或 GitHub 界面）或每天定时跑一次。
# 整条流水线都在 GitHub 的 runner 上完成：ffmpeg 与语音模型都由 runner 提供，
# 所以本机可以关机。
on:
  workflow_dispatch:
    inputs:
      days:
        description: '时间窗口（天）'
        default: '30'
      pages:
        description: '扫描推荐流的页数，每页 100 篇'
        default: '8'
      limit:
        description: '本次最多抓多少篇'
        default: '20'
      translate:
        description: '是否生成中文译文'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      provider:
        description: '翻译服务商（各家 API key 不通用）'
        type: choice
        options: ['deepseek', 'openai']
        default: 'deepseek'
      ids:
        description: '只抓指定的论文：arXiv 编号或 alphaXiv 路径，多个用空格/逗号分隔。填了就不扫描推荐流'
        default: ''
  schedule:
    # 每天 UTC 03:00（迪拜时间 07:00）跑一次增量
    - cron: '0 3 * * *'

permissions:
  contents: write

# 同一时间只跑一个，避免两次提交打架
concurrency:
  group: sync-library
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # runner 每次都是全新虚拟机，装过的库不会自动保留。
          # 这一行让 pip 的下载缓存跨次复用，省掉重复下载 wheel 的时间。
          cache: 'pip'

      - name: 安装 ffmpeg 与 faster-whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # 用 requirements.txt 而不是直接指定包名：
          # setup-python 的 cache: pip 需要依赖清单文件来算缓存 key。
          pip install -q -r requirements.txt

      - name: 缓存语音模型
        uses: actions/cache@v4
        with:
          path: _work/hf
          key: whisper-tiny-v1

      - name: 扫描增量
        id: discover
        env:
          # 经环境变量传入，避免把输入直接插进 shell 脚本
          IDS_INPUT: ${{ inputs.ids }}
        run: |
          mkdir -p _work
          # 指定了论文就直接用，不做推荐流扫描——像是「手动补几篇」的场景：
          # 这些论文浏览量不够或已经出了时间窗，自动扫描永远挑不到它们。
          if [ -n "$IDS_INPUT" ]; then
            echo "指定论文模式，跳过推荐流扫描"
            printf '%s\n' "$IDS_INPUT" | tr ',' ' ' > _work/ids.txt
          else
            python3 scripts/discover.py \
              --days "${{ inputs.days || 30 }}" \
              --pages "${{ inputs.pages || 8 }}" \
              --limit "${{ inputs.limit || 20 }}" \
              --out _work/new.json --ids-only > _work/ids.txt
          fi
          echo "count=$(wc -w < _work/ids.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "---- 本次候选 ----"
          cat _work/ids.txt

      - name: 抓取并本地对齐
        if: steps.discover.outputs.count != '0'
        run: |
          HF_HOME="$PWD/_work/hf" python3 scripts/add_episode.py \
            $(cat _work/ids.txt) --model tiny --no-index

      - name: 生成中文译文
        if: steps.discover.outputs.count != '0' && (inputs.translate != 'no')
        env:
          OPENAI_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          PROVIDER: ${{ inputs.provider || 'deepseek' }}
          OVERRIDE_BASE: ${{ vars.TRANSLATE_BASE_URL }}
          OVERRIDE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::未配置 TRANSLATE_API_KEY，跳过翻译，只抓英文"
            exit 0
          fi

          # 各家 key 不通用：把 DeepSeek 的 key 发去 OpenAI 会直接 401。
          # 所以按服务商决定 endpoint 与模型，仓库变量可覆盖。
          case "$PROVIDER" in
            deepseek) BASE="https://api.deepseek.com/v1"; MODEL="deepseek-chat" ;;
            openai)   BASE="https://api.openai.com/v1";   MODEL="gpt-4o-mini" ;;
            *)        BASE="https://api.deepseek.com/v1"; MODEL="deepseek-chat" ;;
          esac
          if [ -n "$OVERRIDE_BASE" ]; then BASE="$OVERRIDE_BASE"; fi
          if [ -n "$OVERRIDE_MODEL" ]; then MODEL="$OVERRIDE_MODEL"; fi
          echo "翻译服务: $BASE   模型: $MODEL"

          for seg in data/*/segments.json; do
            dir=$(dirname "$seg")
            python3 scripts/translate.py --dir "$dir" \
              --base-url "$BASE" --model "$MODEL" || echo "::warning::$dir 翻译失败"
          done

      - name: 合成播放器数据
        if: steps.discover.outputs.count != '0'
        run: |
          for meta in data/*/meta.json; do
            dir=$(dirname "$meta")
            zh_args=""
            [ -f "$dir/transcript.zh.json" ] && zh_args="--zh $dir/transcript.zh.json"
            python3 scripts/build_episode.py \
              --meta "$dir/meta.json" --segments "$dir/segments.json" \
              $zh_args --out "$dir/episode.json"
          done
          python3 scripts/add_episode.py --reindex-only

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新增内容，跳过提交"
            exit 0
          fi
          git commit -m "Sync: 新增播客 $(date -u +%Y-%m-%d)"

          # 工作流运行期间可能有人推了新提交（比如改了前端）。
          # 直接 push 会被拒（non-fast-forward），而且运行器是临时的，
          # 一被拒这次抓到的内容就全丢了。所以先 rebase 到远端再推，并重试几次。
          for attempt in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $attempt 次推送被拒，先 rebase 到远端再试"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::rebase 失败，需要人工处理"
              exit 1
            fi
            sleep 5
          done
          echo "::error::连续三次推送失败，请检查分支保护设置"
          exit 1

      - name: 汇总
        if: always()
        run: |
          echo "### 同步结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          import json, os
          p = "_work/new.json"
          if os.path.exists(p):
              d = json.load(open(p, encoding="utf-8"))
              print(f"- 扫描 {d['scanned_at']}，窗口 {d['days']} 天")
              print(f"- feed {d['feed_papers']} 篇 → AI {d['ai_papers']}"
                    f"（门槛前 {d['ai_before_threshold']}）→ 新增 {len(d['new'])}")
              print(f"- 命中档位 {d.get('tier_counts')}")
          print(f"- 库内共 {len([n for n in os.listdir('data') if os.path.exists(f'data/{n}/episode.json')])} 集")
          PY
